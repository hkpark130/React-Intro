<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="390" viewBox="0 0 1040 390" role="img" aria-labelledby="title desc">
<title id="title">CloudFront와 S3를 이용한 프론트엔드 구성</title>
<desc id="desc">사용자가 CloudFront에 요청하면 Web ACL이 요청을 검사하고, 캐시에 없는 파일은 OAI 권한으로 S3 REST 원본에서 읽는다.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#41627d"/></marker></defs>
<rect width="1040" height="390" rx="16" fill="#f5f8fc"/>
<g font-family="Malgun Gothic,Segoe UI,Arial,sans-serif" fill="#17334c"><text x="30" y="42" font-size="23" font-weight="700">CloudFront와 S3를 이용한 프론트엔드 구성</text><text x="30" y="71" font-size="15">2022년 3월 · OAI로 S3 접근 허용, Web ACL로 요청 검사</text>
<rect x="379" y="101" width="283" height="65" rx="9" fill="#fff5e2" stroke="#c1a061" stroke-width="1.5"/><text x="520" y="127" text-anchor="middle" font-size="18">AWS WAF Web ACL</text><text x="520" y="151" text-anchor="middle" font-size="14">Managed rules + rate-based rule</text>
<path d="M520 166V213" stroke="#a58237" stroke-width="2" stroke-dasharray="6 4"/><text x="536" y="195" font-size="13">Associated with distribution</text>
<g fill="#fff" stroke="#8da9c1" stroke-width="1.5"><rect x="30" y="215" width="201" height="96" rx="9"/><rect x="379" y="215" width="283" height="96" rx="9"/><rect x="802" y="215" width="208" height="96" rx="9"/></g>
<g text-anchor="middle"><text x="130" y="250" font-size="19">Browser</text><text x="130" y="277" font-size="14">HTML / JS / CSS</text><text x="520" y="246" font-size="19">CloudFront</text><text x="520" y="271" font-size="14">Cache + viewer HTTPS policy</text><text x="520" y="292" font-size="13">Requests inspected by Web ACL</text><text x="906" y="248" font-size="19">S3 bucket</text><text x="906" y="275" font-size="14">REST origin + OAI</text></g>
<g stroke="#41627d" stroke-width="2.5" fill="none" marker-end="url(#a)"><path d="M231 259H375"/><path d="M662 259H798"/></g>
<g font-size="13" text-anchor="middle"><text x="305" y="240">Viewer requests</text><text x="305" y="286">HTTP → HTTPS</text><text x="732" y="239">On cache miss</text><text x="732" y="286">Object read</text></g>
<text x="30" y="350" font-size="15">CloudFront가 OAI 권한으로 S3의 파일을 읽는 구성. 원본 주소는 S3 REST 엔드포인트를 사용.</text>
</g></svg>
