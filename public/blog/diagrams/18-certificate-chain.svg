<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">TLS 인증서: 발급 방향과 검증 방향은 반대다</title><desc id="desc">루트는 클라이언트가 미리 신뢰한 trust anchor다. 서버가 보낸다는 이유만으로 신뢰하지 않는다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">TLS 인증서: 발급 방향과 검증 방향은 반대다</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">루트는 클라이언트가 미리 신뢰한 trust anchor다. 서버가 보낸다는 이유만으로 신뢰하지 않는다.</text><text x="270" y="175" font-size="24" fill="#173c56" text-anchor="middle" font-weight="700">CA가 하위 인증서를 서명</text><text x="985" y="175" font-size="24" fill="#235e47" text-anchor="middle" font-weight="700">클라이언트의 경로 검증</text><rect x="75" y="220" width="390" height="115" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="95" y="256" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">루트 CA</text><text x="95" y="292" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">trust store의 신뢰점</text><rect x="75" y="430" width="390" height="115" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="95" y="466" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">중간 CA</text><text x="95" y="502" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">루트 또는 상위 CA가 서명</text><rect x="75" y="640" width="390" height="115" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="95" y="676" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">서버 leaf</text><text x="95" y="712" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">서버 이름 / 공개키 / 유효기간</text><rect x="790" y="220" width="390" height="115" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="810" y="256" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">신뢰하는 루트 CA</text><text x="810" y="292" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">로컬 trust store에서 결정</text><rect x="790" y="430" width="390" height="115" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="810" y="466" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">중간 인증서 검사</text><text x="810" y="502" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">서명 / CA 제약 / 유효성</text><rect x="790" y="640" width="390" height="115" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="810" y="676" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">서버 인증서 검사</text><text x="810" y="712" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">이름 / 용도 / 기간 / 서명</text><polyline points="270,335 270,430" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="365" y="391" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">발급·서명</text><polyline points="270,545 270,640" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="365" y="601" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">발급·서명</text><polyline points="985,640 985,545" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="1090" y="601" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">상위 CA 확인</text><polyline points="985,430 985,335" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="1090" y="391" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">신뢰점에 연결</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">일반적으로 서버는 leaf와 필요한 중간 인증서를 제공한다. 루트 전송이 클라이언트의 신뢰를 추가하지 않는다.</text></g></svg>