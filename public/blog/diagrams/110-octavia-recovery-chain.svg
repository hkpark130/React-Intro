<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">Octavia Load Balancer 복구 사슬</title><desc id="desc">관측 객체를 사용자 서비스에 연결하고 제어면 의존성을 순서대로 복구</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#647487" /></marker><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#172331} .title{font-size:32px;font-weight:700} .sub{font-size:17px;fill:#556577} .head{font-size:20px;font-weight:700} .body{font-size:15px} .small{font-size:13px;fill:#57687a} .card{fill:#fff;stroke:#ccd6df;stroke-width:1.4} .arrow{fill:none;stroke:#647487;stroke-width:2.4;marker-end:url(#arrow)} </style></defs><rect width="1320" height="820" fill="#f7f9fc" /><rect width="1320" height="8" fill="#2875a8" /><text x="55" y="60" class="title">Octavia Load Balancer 복구 사슬</text><text x="55" y="92" class="sub">관측 객체를 사용자 서비스에 연결하고 제어면 의존성을 순서대로 복구</text><g id="column-1"><rect x="55" y="155" width="284" height="520" rx="16" fill="#e8f2fb" stroke="#3979ad" stroke-width="1.7" /><text x="77" y="197" class="head">식별 시작</text><rect x="73" y="230" width="248" height="66" rx="10" class="card" /><text x="89" y="258" class="body">OVS tap·counter</text><rect x="73" y="314" width="248" height="87" rx="10" class="card" /><text x="89" y="342" class="body">external_ids 확인</text><text x="89" y="363" class="small">드롭은 원인 미확정</text></g><path d="M340 420 H358" class="arrow" /><g id="column-2"><rect x="364" y="155" width="284" height="520" rx="16" fill="#eef7f0" stroke="#4d8b61" stroke-width="1.7" /><text x="386" y="197" class="head">객체 연결</text><rect x="382" y="230" width="248" height="66" rx="10" class="card" /><text x="398" y="258" class="body">Neutron port → amphora</text><rect x="382" y="314" width="248" height="66" rx="10" class="card" /><text x="398" y="342" class="body">Nova VM과 LB 매핑</text><rect x="382" y="398" width="248" height="87" rx="10" class="card" /><text x="398" y="426" class="body">Kubernetes Service</text><text x="398" y="447" class="small">LB의 수명 주체</text></g><path d="M648 420 H667" class="arrow" /><g id="column-3"><rect x="672" y="155" width="284" height="520" rx="16" fill="#fff4e6" stroke="#b7792d" stroke-width="1.7" /><text x="694" y="197" class="head">제어면 확인</text><rect x="690" y="230" width="248" height="66" rx="10" class="card" /><text x="706" y="258" class="body">관리 밖 worker</text><rect x="690" y="314" width="248" height="66" rx="10" class="card" /><text x="706" y="342" class="body">작업 소비자 충돌 가능</text><rect x="690" y="398" width="248" height="87" rx="10" class="card" /><text x="706" y="426" class="body">mTLS 인증서·상태</text><text x="706" y="447" class="small">만료와 PENDING 확인</text></g><path d="M956 420 H976" class="arrow" /><g id="column-4"><rect x="980" y="155" width="284" height="520" rx="16" fill="#f2edfb" stroke="#7357b8" stroke-width="1.7" /><text x="1002" y="197" class="head">생성 의존성</text><rect x="998" y="230" width="248" height="66" rx="10" class="card" /><text x="1014" y="258" class="body">Glance + Ceph</text><rect x="998" y="314" width="248" height="66" rx="10" class="card" /><text x="1014" y="342" class="body">레코드와 데이터 확인</text><rect x="998" y="398" width="248" height="87" rx="10" class="card" /><text x="1014" y="426" class="body">새 LB 검증</text><text x="1014" y="447" class="small">amphora·listener·요청</text></g><rect x="55" y="715" width="1210" height="55" rx="11" fill="#fff" stroke="#d2dae3" /><text x="78" y="748" class="body">기존 LB 정리와 새 LB 검증을 나눈다. DB 직접 변경에는 백업·대상 행·버전별 스키마 검토가 필요하다.</text></svg>