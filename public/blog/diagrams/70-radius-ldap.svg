<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">EAP-TTLS: 터널은 단말과 FreeRADIUS 사이에 있다</title><desc id="desc">AP는 EAP를 전달한다. FreeRADIUS → LDAP의 TLS 연결은 별도 구간이다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">EAP-TTLS: 터널은 단말과 FreeRADIUS 사이에 있다</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">AP는 EAP를 전달한다. FreeRADIUS → LDAP의 TLS 연결은 별도 구간이다.</text><rect x="45" y="250" width="275" height="150" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="286" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">단말 / supplicant</text><text x="65" y="322" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">서버 인증서·이름 검증</text><text x="65" y="351" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">TTLS 내부 PAP 선택</text><rect x="515" y="250" width="250" height="150" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="535" y="286" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Wi-Fi AP</text><text x="535" y="322" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">EAP 메시지 전달</text><text x="535" y="351" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">RADIUS client</text><rect x="965" y="250" width="305" height="150" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="985" y="286" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">FreeRADIUS</text><text x="985" y="322" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">TTLS 종단</text><text x="985" y="351" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">inner-tunnel 인증</text><rect x="965" y="590" width="305" height="140" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="985" y="626" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">OpenLDAP</text><text x="985" y="662" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">사용자 검색 / bind</text><text x="985" y="691" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">TLS 서버 인증서 제공</text><polyline points="320,328 515,328" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="417" y="307" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">EAP over LAN</text><polyline points="765,328 965,328" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="865" y="307" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">RADIUS / EAP</text><path d="M 180 250 V 180 H 1115 V 250" fill="none" stroke="#28785e" stroke-width="4" stroke-dasharray="10 7"/><text x="650" y="156" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">EAP-TTLS 암호화 터널: 단말 ↔ FreeRADIUS</text><polyline points="1115,400 1115,590" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="965" y="509" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">별도 LDAPS / StartTLS</text><rect x="65" y="540" width="700" height="165" rx="14" fill="#fff2e6" stroke="#b9cbd8" stroke-width="2"/><text x="85" y="576" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">서로 다른 확인 항목</text><text x="85" y="612" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">① 단말이 진짜 RADIUS 서버인지 검증하는가?</text><text x="85" y="641" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">② 실제 inner 인증이 non-EAP PAP로 전달되는가?</text><text x="85" y="670" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">③ LDAP 연결도 암호화와 CA 검증을 수행하는가?</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">세 조건은 원문의 적용 완료 사실이 아니다. LDAP 구간 require_cert=never를 안전한 예제로 재사용하지 않는다.</text></g></svg>