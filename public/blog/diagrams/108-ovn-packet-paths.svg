<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1000" viewBox="0 0 1320 1000" role="img" aria-labelledby="title desc"><title id="title">OVN 패킷 경로: 같은 호스트·원격 호스트·외부</title><desc id="desc">실선은 패킷 전달 방향이다. 논리 switch/router 판정과 실행되는 물리 호스트를 함께 구분한다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2775ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#278464"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b34848"/></marker></defs><rect width="1320" height="1000" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="59" font-size="32" fill="#17384f" font-weight="700">OVN 패킷 경로: 같은 호스트·원격 호스트·외부</text><text x="45" y="96" font-size="19" fill="#526c80" font-weight="400">실선은 패킷 전달 방향이다. 논리 switch/router 판정과 실행되는 물리 호스트를 함께 구분한다.</text><rect x="45" y="133" width="1230" height="185" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="65" y="168" font-size="22" fill="#173d56" font-weight="700">1. 같은 subnet · 같은 host — logical switch의 L2 전달</text><rect x="75" y="196" width="145" height="83" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="93" y="229" font-size="22" fill="#173d56" font-weight="700">VM A</text><rect x="280" y="196" width="140" height="83" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="298" y="229" font-size="22" fill="#173d56" font-weight="700">tap A</text><rect x="480" y="196" width="240" height="83" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="498" y="229" font-size="22" fill="#173d56" font-weight="700">br-int</text><text x="498" y="258" font-size="18" fill="#294357" font-weight="400">OVS local forwarding</text><rect x="790" y="196" width="140" height="83" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="808" y="229" font-size="22" fill="#173d56" font-weight="700">tap B</text><rect x="1010" y="196" width="225" height="83" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="1028" y="229" font-size="22" fill="#173d56" font-weight="700">VM B</text><polyline points="220,237 280,237" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><polyline points="420,237 480,237" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><polyline points="720,237 790,237" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><polyline points="930,237 1010,237" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><rect x="45" y="347" width="1230" height="218" rx="14" fill="#f0f6f1" stroke="#bfd0df" stroke-width="2"/><text x="65" y="383" font-size="22" fill="#22654b" font-weight="700">2. 같은 subnet · 다른 host — 같은 L2 판정을 Geneve로 전달</text><rect x="65" y="407" width="490" height="129" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="80" y="433" font-size="17" fill="#526c80" font-weight="700">Compute A</text><rect x="85" y="446" width="195" height="70" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="103" y="479" font-size="20" fill="#173d56" font-weight="700">VM A / tap A</text><rect x="337" y="446" width="195" height="70" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="355" y="479" font-size="20" fill="#173d56" font-weight="700">br-int A</text><rect x="765" y="407" width="490" height="129" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="782" y="433" font-size="17" fill="#526c80" font-weight="700">Compute B</text><rect x="786" y="446" width="195" height="70" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="804" y="479" font-size="20" fill="#173d56" font-weight="700">br-int B</text><rect x="1038" y="446" width="195" height="70" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="1056" y="479" font-size="20" fill="#173d56" font-weight="700">tap B / VM B</text><polyline points="280,481 337,481" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><polyline points="532,481 786,481" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="613" y="460" font-size="18" fill="#2775ad" font-weight="600">Geneve</text><polyline points="981,481 1038,481" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><rect x="45" y="594" width="1230" height="294" rx="14" fill="#fff4e7" stroke="#bfd0df" stroke-width="2"/><text x="65" y="630" font-size="22" fill="#875b2a" font-weight="700">3. 외부 통신 — 당시 centralized gateway / NAT 구성</text><rect x="75" y="681" width="230" height="130" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="93" y="714" font-size="22" fill="#173d56" font-weight="700">VM / tap / br-int</text><text x="93" y="743" font-size="18" fill="#294357" font-weight="400">logical switch에서</text><text x="93" y="768" font-size="18" fill="#294357" font-weight="400">router 방향으로 전달</text><rect x="505" y="655" width="475" height="195" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="525" y="687" font-size="21" fill="#173d56" font-weight="700">Gateway chassis</text><rect x="525" y="708" width="210" height="118" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="543" y="741" font-size="20" fill="#173d56" font-weight="700">br-int</text><text x="543" y="770" font-size="18" fill="#294357" font-weight="400">logical router / NAT</text><text x="543" y="795" font-size="18" fill="#294357" font-weight="400">localnet → patch</text><rect x="778" y="708" width="182" height="118" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="796" y="741" font-size="20" fill="#173d56" font-weight="700">br-ex</text><text x="796" y="770" font-size="18" fill="#294357" font-weight="400">물리 uplink</text><rect x="1053" y="708" width="182" height="118" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="1071" y="741" font-size="20" fill="#173d56" font-weight="700">외부망</text><text x="1071" y="770" font-size="18" fill="#294357" font-weight="400">물리 라우터</text><polyline points="305,760 525,760" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="335" y="718" font-size="18" fill="#2775ad" font-weight="600">다른 host면</text><text x="354" y="743" font-size="18" fill="#2775ad" font-weight="600">Geneve</text><polyline points="735,760 778,760" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><polyline points="960,760 1053,760" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="75" y="875" font-size="18" fill="#294357" font-weight="400">같은 chassis면 원격 터널 구간을 생략한다. distributed FIP·provider 설계가 다르면 gateway/NAT 위치도 달라진다.</text><rect x="45" y="920" width="1230" height="55" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="64" y="955" font-size="18" fill="#294357" font-weight="400">ovn-trace는 논리 경로 시뮬레이션이다. 실제 NIC·터널의 전달이나 손실은 별도 캡처와 카운터로 확인한다.</text></g></svg>