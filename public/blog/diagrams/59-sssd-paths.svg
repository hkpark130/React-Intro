<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">SSSD: 사용자 이름 조회와 비밀번호 인증을 나누어 본다</title><desc id="desc">getent 성공은 SSH의 인증·접근 허용·홈 생성 성공을 모두 뜻하지 않는다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">SSSD: 사용자 이름 조회와 비밀번호 인증을 나누어 본다</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">getent 성공은 SSH의 인증·접근 허용·홈 생성 성공을 모두 뜻하지 않는다.</text><rect x="45" y="150" width="1230" height="465" rx="14" fill="#edf3fa" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="188" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Linux 호스트: PAM · NSS · SSSD가 모두 이 호스트에서 동작</text><rect x="75" y="230" width="245" height="125" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="95" y="266" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">sshd</text><text x="95" y="302" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">SSH 접속 요청</text><text x="95" y="331" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">인증 방식·PAM 설정</text><rect x="455" y="230" width="290" height="125" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="475" y="266" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">PAM</text><text x="475" y="302" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">auth / account / session</text><text x="475" y="331" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">mkhomedir 연동 별도</text><rect x="75" y="440" width="245" height="125" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="95" y="476" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">getent / id</text><text x="95" y="512" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">사용자·그룹 조회</text><rect x="455" y="440" width="290" height="125" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="475" y="476" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">NSS</text><text x="475" y="512" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">passwd / group에 sss</text><rect x="960" y="335" width="290" height="140" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="980" y="371" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">SSSD</text><text x="980" y="407" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">identity / auth provider</text><text x="980" y="436" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">정책에 따른 local cache</text><rect x="960" y="665" width="290" height="130" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="980" y="701" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">OpenLDAP</text><text x="980" y="737" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">별도 디렉터리 서버</text><text x="980" y="766" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">POSIX 조회·인증 / TLS</text><polyline points="320,290 455,290" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="388" y="270" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">PAM 호출</text><polyline points="320,500 455,500" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="388" y="480" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">NSS 조회</text><polyline points="745,290 850,290 850,375 960,375" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="850" y="265" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">인증 / 접근</text><polyline points="745,500 850,500 850,440 960,440" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="850" y="536" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">사용자·그룹 조회</text><polyline points="1105,475 1105,665" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="1190" y="648" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">LDAP 요청</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">sudo는 별도 provider·schema·정책이 필요하다. 오프라인 cache는 이전 인증과 만료 조건의 영향을 받는다.</text></g></svg>