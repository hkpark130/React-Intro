<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">Rancher·CCM·CSI는 서로 다른 제어 주체다</title><desc id="desc">각 구성요소가 호출하는 OpenStack API와 책임을 나누어 장애 범위를 확인한다</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2573ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248361"/></marker></defs><rect width="1320" height="820" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="50" y="62" font-size="34" fill="#142c40" font-weight="700">Rancher·CCM·CSI는 서로 다른 제어 주체다</text><text x="50" y="101" font-size="19" fill="#536b80" font-weight="400">각 구성요소가 호출하는 OpenStack API와 책임을 나누어 장애 범위를 확인한다</text><rect x="50" y="349" width="595" height="349" rx="18" fill="#eef6f1" stroke="#92bea4" stroke-width="2"/><text x="74" y="381" font-size="20" fill="#226544" font-weight="700">워크로드 Kubernetes 클러스터</text><rect x="75" y="160" width="545" height="140" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><text x="97" y="196" font-size="23" fill="#163449" font-weight="700">Rancher + OpenStack Node Driver</text><text x="97" y="232" font-size="18" fill="#263e53" font-weight="400">클러스터 프로비저닝 / VM 생성·삭제</text><text x="97" y="260" font-size="18" fill="#263e53" font-weight="400">노드 수명 관리</text><rect x="75" y="402" width="545" height="110" rx="16" fill="#fff" stroke="#b9cbd9" stroke-width="2"/><text x="97" y="438" font-size="23" fill="#163449" font-weight="700">OpenStack CCM</text><text x="97" y="474" font-size="18" fill="#263e53" font-weight="400">노드 식별과 Service type=LoadBalancer</text><rect x="75" y="558" width="545" height="110" rx="16" fill="#fff" stroke="#b9cbd9" stroke-width="2"/><text x="97" y="594" font-size="23" fill="#163449" font-weight="700">Cinder CSI</text><text x="97" y="630" font-size="18" fill="#263e53" font-weight="400">PVC 볼륨 생성 / attach / node mount</text><rect x="865" y="160" width="400" height="140" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="887" y="196" font-size="23" fill="#163449" font-weight="700">Nova / Neutron API</text><text x="887" y="232" font-size="18" fill="#263e53" font-weight="400">VM과 NIC·네트워크 생성 요청</text><text x="887" y="260" font-size="18" fill="#263e53" font-weight="400">Keystone 인증</text><rect x="865" y="402" width="400" height="110" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="887" y="438" font-size="23" fill="#163449" font-weight="700">Nova / Octavia API</text><text x="887" y="474" font-size="18" fill="#263e53" font-weight="400">인스턴스 정보 / Load Balancer</text><rect x="865" y="558" width="400" height="110" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="887" y="594" font-size="23" fill="#163449" font-weight="700">Cinder / Nova API</text><text x="887" y="630" font-size="18" fill="#263e53" font-weight="400">볼륨 생성 / VM attach·detach</text><polyline points="620,230 865,230" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="650" y="209" font-size="17" fill="#2573ad" font-weight="600">Node Driver의 요청</text><polyline points="620,459 865,459" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="673" y="438" font-size="17" fill="#2573ad" font-weight="600">CCM의 요청</text><polyline points="620,615 865,615" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="678" y="594" font-size="17" fill="#2573ad" font-weight="600">CSI의 요청</text><rect x="50" y="732" width="1220" height="58" rx="12" fill="#fff" stroke="#cbd6df"/><text x="72" y="768" font-size="18" fill="#263e53" font-weight="400">세 경로의 권한과 수명 주기는 별개다. Cinder Multi-Attach만으로 공유 파일시스템 RWX가 제공되지는 않는다.</text></g></svg>