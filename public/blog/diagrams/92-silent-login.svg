<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">silent 갱신: refresh token과 iframe은 서로 다른 경로다</title><desc id="desc">사용할 수 있는 refresh token이 있는지에 따라 실제 라이브러리 동작을 확인한다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">silent 갱신: refresh token과 iframe은 서로 다른 경로다</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">사용할 수 있는 refresh token이 있는지에 따라 실제 라이브러리 동작을 확인한다.</text><rect x="45" y="140" width="1230" height="260" rx="14" fill="#edf6f1" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="175" font-size="23" fill="#235e47" text-anchor="start" font-weight="700">A. refresh token이 있는 경우</text><rect x="80" y="215" width="370" height="140" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="100" y="251" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">앱 / OIDC client</text><text x="100" y="287" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">보관 중인 refresh token</text><text x="100" y="316" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">token endpoint로 직접 요청</text><rect x="900" y="215" width="335" height="140" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="920" y="251" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Keycloak token endpoint</text><text x="920" y="287" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">refresh grant 검증</text><text x="920" y="316" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">IdP iframe 쿠키와 별개</text><polyline points="450,255 900,255" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="675" y="242" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">refresh_token grant</text><polyline points="900,325 450,325" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="675" y="312" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">새 token 응답</text><rect x="45" y="430" width="1230" height="350" rx="14" fill="#eef3fb" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="470" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">B. refresh token이 없어 iframe 인증을 사용하는 경우</text><rect x="80" y="530" width="280" height="140" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="100" y="566" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">앱</text><text x="100" y="602" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">silent callback 준비</text><text x="100" y="631" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">성공·실패 상태 처리</text><rect x="515" y="530" width="290" height="140" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="535" y="566" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">숨겨진 iframe</text><text x="535" y="602" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">prompt=none 요청</text><text x="535" y="631" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">브라우저 쿠키 정책 적용</text><rect x="955" y="530" width="280" height="140" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="975" y="566" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Keycloak authorize</text><text x="975" y="602" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">IdP 세션 쿠키 확인</text><text x="975" y="631" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">상호작용 필요 시 오류</text><polyline points="360,570 515,570" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="438" y="549" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">iframe 로드</text><polyline points="805,570 955,570" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="880" y="549" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">쿠키 조건 충족 시</text><polyline points="1095,670 1095,710 650,710 650,670" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="827" y="741" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">redirect 결과</text><polyline points="515,632 360,632" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="438" y="612" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">callback 전달</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">HTTPS만으로 cross-site iframe 쿠키가 허용되지는 않는다. SameSite와 제3자 쿠키 정책을 함께 확인한다.</text></g></svg>