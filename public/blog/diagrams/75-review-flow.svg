<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="370" viewBox="0 0 1060 370" role="img" aria-labelledby="title desc">
<title id="title">Local LLM merge request review experiment</title>
<desc id="desc">A shell runner fetches GitLab merge request changes, filters files and calls a local Ollama CodeLlama model. The runner posts the generated feedback to GitLab for human review. The model has no GitLab token or tool access.</desc>
<defs><marker id="a" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#41627d"/></marker></defs>
<rect width="1060" height="370" rx="16" fill="#f5f8fc"/>
<g font-family="Segoe UI,Arial,sans-serif" fill="#17334c"><text x="30" y="42" font-size="23" font-weight="700">Local model feedback for a GitLab MR</text><text x="30" y="70" font-size="15">September 2024 experiment · generated feedback still needs human review</text>
<rect x="313" y="98" width="716" height="212" rx="14" fill="#eaf1f8" stroke="#9bb3ca" stroke-dasharray="6 4"/>
<text x="335" y="126" font-size="16" font-weight="700">Runner environment</text>
<g fill="#fff" stroke="#8da9c1" stroke-width="1.5"><rect x="32" y="145" width="201" height="96" rx="9"/><rect x="345" y="152" width="270" height="89" rx="9"/><rect x="733" y="152" width="265" height="89" rx="9"/></g>
<g text-anchor="middle" font-size="18"><text x="132" y="177">GitLab MR</text><text x="132" y="204" font-size="15">Changes + review thread</text><text x="480" y="182">Shell job + Python</text><text x="480" y="210" font-size="15">Filter / call / collect results</text><text x="865" y="182">Ollama + CodeLlama</text><text x="865" y="210" font-size="15">Local inference</text></g>
<g stroke="#41627d" stroke-width="2" fill="none" marker-end="url(#a)"><path d="M233 171H341"/><path d="M615 171H729"/><path d="M733 224H619"/><path d="M345 224H237"/></g>
<g text-anchor="middle" font-size="13"><text x="288" y="157">MR diff</text><text x="674" y="157">Prompt + diff</text><text x="674" y="248">Model response</text><text x="288" y="248">MR comment</text></g>
<text x="335" y="285" font-size="14">GitLab credentials stay with the runner; the model receives code as input.</text>
<text x="30" y="345" font-size="15">Report reviewed / skipped / failed files and the reviewed commit SHA; a comment alone does not prove coverage.</text>
</g></svg>
