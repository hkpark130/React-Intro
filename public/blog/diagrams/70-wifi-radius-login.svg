<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="500" viewBox="0 0 1320 500" role="img" aria-labelledby="title desc"><title id="title">Wi-Fi 로그인이 LDAP까지 가는 경로</title><desc id="desc">단말의 ID/PW를 AP가 FreeRADIUS로 넘기고, FreeRADIUS가 OpenLDAP에 bind해 검증한다</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2573ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248361"/></marker></defs><rect width="1320" height="500" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="50" y="62" font-size="34" fill="#142c40" font-weight="700">Wi-Fi 로그인이 LDAP까지 가는 경로</text><text x="50" y="101" font-size="19" fill="#536b80" font-weight="400">단말의 ID/PW를 AP가 FreeRADIUS로 넘기고, FreeRADIUS가 OpenLDAP에 bind해 검증한다</text><rect x="50" y="170" width="230" height="175" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(222 190)" fill="none" stroke="#2573ad" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="6" width="24" height="17" rx="2"/><path d="M2 27h30"/></g><text x="74" y="226" font-size="23" fill="#163449" font-weight="700">사용자 단말</text><text x="74" y="270" font-size="18" fill="#263e53" font-weight="400">LDAP 계정의 ID/PW</text><text x="74" y="298" font-size="18" fill="#263e53" font-weight="400">802.1X supplicant</text><rect x="380" y="170" width="230" height="175" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(552 190)" fill="none" stroke="#2573ad" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 14a20 20 0 0 1 26 0"/><path d="M9 20a12 12 0 0 1 16 0"/><circle cx="17" cy="27" r="2.2"/></g><text x="404" y="226" font-size="23" fill="#163449" font-weight="700">Wi-Fi AP</text><text x="404" y="270" font-size="18" fill="#263e53" font-weight="400">RADIUS client</text><text x="404" y="298" font-size="18" fill="#263e53" font-weight="400">EAP 메시지 전달</text><rect x="710" y="170" width="230" height="175" rx="16" fill="#eaf6ef" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(882 190)" fill="none" stroke="#248361" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6" width="28" height="9" rx="2"/><rect x="3" y="19" width="28" height="9" rx="2"/></g><text x="734" y="226" font-size="23" fill="#163449" font-weight="700">FreeRADIUS</text><text x="734" y="270" font-size="18" fill="#263e53" font-weight="400">1812/UDP 수신</text><text x="734" y="298" font-size="18" fill="#263e53" font-weight="400">EAP-TTLS 종단</text><rect x="1040" y="170" width="230" height="175" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(1212 190)" fill="none" stroke="#5a4a9e" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="17" cy="8" rx="11" ry="4"/><path d="M6 8v18c0 2.2 4.9 4 11 4s11-1.8 11-4V8"/><path d="M6 17c0 2.2 4.9 4 11 4s11-1.8 11-4"/></g><text x="1064" y="226" font-size="23" fill="#163449" font-weight="700">OpenLDAP</text><text x="1064" y="270" font-size="18" fill="#263e53" font-weight="400">사용자 검색 / bind</text><text x="1064" y="298" font-size="18" fill="#263e53" font-weight="400">계정 원본</text><polyline points="280,230 380,230" fill="none" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="298" y="212" font-size="17" fill="#2573ad" font-weight="600">802.1X</text><polyline points="610,230 710,230" fill="none" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="626" y="212" font-size="17" fill="#2573ad" font-weight="600">RADIUS</text><polyline points="940,230 1040,230" fill="none" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="954" y="212" font-size="17" fill="#2573ad" font-weight="600">조회·bind</text><polyline points="1155,345 1155,385 165,385 165,345" fill="none" stroke="#248361" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#green)"/><text x="536" y="370" font-size="17" fill="#248361" font-weight="600">검증 결과 → 접속 허용 / 거부</text><rect x="50" y="420" width="1220" height="58" rx="12" fill="#fff" stroke="#cbd6df"/><text x="72" y="456" font-size="18" fill="#263e53" font-weight="400">화살표는 Wi-Fi 로그인 한 번의 요청 방향이다. 터널이 어디에 있는지는 아래 그림에서 따로 본다.</text></g></svg>