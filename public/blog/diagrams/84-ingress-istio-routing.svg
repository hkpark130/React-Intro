<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647487"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,sans-serif;fill:#172331}.t{font-size:32px;font-weight:700}.s{font-size:17px;fill:#556577}.h{font-size:20px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#57687a}.c{fill:#fff;stroke:#ccd6df;stroke-width:1.4}.a{fill:none;stroke:#647487;stroke-width:2.4;marker-end:url(#a)}</style></defs><rect width="1320" height="820" fill="#f7f9fc"/><rect width="1320" height="8" fill="#2875a8"/><title id="title">NGINX Ingress와 Istio 경로 비교</title><desc id="desc">같은 host·path·service port를 유지해야 동등 전환을 검증할 수 있음</desc><text x="55" y="60" class="t">NGINX Ingress와 Istio 경로 비교</text><text x="55" y="92" class="s">같은 host·path·service port를 유지해야 동등 전환을 검증할 수 있음</text><g><rect x="55" y="155" width="284" height="520" rx="16" fill="#e8f2fb" stroke="#3979ad" stroke-width="1.7"/><text x="77" y="197" class="h">NGINX Ingress</text><rect x="73" y="230" width="248" height="87" rx="10" class="c"/><text x="89" y="258" class="b">host A + /</text><text x="89" y="279" class="n">Service A:80</text><rect x="73" y="335" width="248" height="87" rx="10" class="c"/><text x="89" y="363" class="b">host B + /test</text><text x="89" y="384" class="n">Service B:80</text></g><g><rect x="364" y="155" width="284" height="520" rx="16" fill="#eef7f0" stroke="#4d8b61" stroke-width="1.7"/><text x="386" y="197" class="h">Istio ingressgateway</text><rect x="382" y="230" width="248" height="87" rx="10" class="c"/><text x="398" y="258" class="b">Gateway</text><text x="398" y="279" class="n">listen port와 hosts</text><rect x="382" y="335" width="248" height="87" rx="10" class="c"/><text x="398" y="363" class="b">VirtualService</text><text x="398" y="384" class="n">URI match와 destination</text></g><g><rect x="672" y="155" width="284" height="520" rx="16" fill="#fff4e6" stroke="#b7792d" stroke-width="1.7"/><text x="694" y="197" class="h">초안의 차이</text><rect x="690" y="230" width="248" height="87" rx="10" class="c"/><text x="706" y="258" class="b">/test match 누락</text><text x="706" y="279" class="n">동등 routing 아님</text><rect x="690" y="335" width="248" height="87" rx="10" class="c"/><text x="706" y="363" class="b">80 ↔ 8080 차이</text><text x="706" y="384" class="n">Service port 확인 필요</text></g><g><rect x="980" y="155" width="284" height="520" rx="16" fill="#f2edfb" stroke="#7357b8" stroke-width="1.7"/><text x="1002" y="197" class="h">검증</text><rect x="998" y="230" width="248" height="87" rx="10" class="c"/><text x="1014" y="258" class="b">같은 Host·path 요청</text><text x="1014" y="279" class="n">status와 backend identity</text><rect x="998" y="335" width="248" height="87" rx="10" class="c"/><text x="1014" y="363" class="b">mTLS·AuthZ</text><text x="1014" y="384" class="n">별도 policy 범위</text></g><rect x="55" y="715" width="1210" height="55" rx="11" fill="#fff" stroke="#d2dae3"/><text x="78" y="748" class="b">Istio 설치만으로 mTLS, authorization, retry 요구가 자동 충족되지는 않는다.</text></svg>