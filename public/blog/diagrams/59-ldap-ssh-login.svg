<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="480" viewBox="0 0 1320 480" role="img" aria-labelledby="title desc"><title id="title">LDAP 계정으로 SSH 로그인할 때의 인증 흐름</title><desc id="desc">sshd가 받은 ID/PW를 PAM이 SSSD에 넘기고, SSSD가 OpenLDAP에 bind해 검증한다</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2573ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248361"/></marker></defs><rect width="1320" height="480" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="50" y="62" font-size="34" fill="#142c40" font-weight="700">LDAP 계정으로 SSH 로그인할 때의 인증 흐름</text><text x="50" y="101" font-size="19" fill="#536b80" font-weight="400">sshd가 받은 ID/PW를 PAM이 SSSD에 넘기고, SSSD가 OpenLDAP에 bind해 검증한다</text><rect x="50" y="170" width="340" height="170" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(74 196)" fill="none" stroke="#2573ad" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="20" cy="12" r="7.5"/><path d="M5 36c0-8.3 6.7-13 15-13s15 4.7 15 13"/></g><text x="132" y="228" font-size="23" fill="#163449" font-weight="700">사용자 (ID/PW)</text><text x="74" y="276" font-size="18" fill="#263e53" font-weight="400">LDAP 계정의 ID와 비밀번호</text><text x="74" y="304" font-size="18" fill="#263e53" font-weight="400">ssh user@host</text><rect x="490" y="170" width="340" height="170" rx="16" fill="#eaf6ef" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(514 196)" fill="none" stroke="#248361" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="7" width="32" height="11" rx="3"/><rect x="4" y="23" width="32" height="11" rx="3"/></g><text x="572" y="228" font-size="23" fill="#163449" font-weight="700">Linux (SSSD·PAM 연동)</text><text x="514" y="276" font-size="18" fill="#263e53" font-weight="400">sshd UsePAM yes → PAM</text><text x="514" y="304" font-size="18" fill="#263e53" font-weight="400">nsswitch.conf에 sss 등록</text><rect x="930" y="170" width="340" height="170" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><g transform="translate(954 196)" fill="none" stroke="#5a4a9e" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="20" cy="9" rx="13" ry="5"/><path d="M7 9v22c0 2.8 5.8 5 13 5s13-2.2 13-5V9"/><path d="M7 20c0 2.8 5.8 5 13 5s13-2.2 13-5"/></g><text x="1012" y="228" font-size="23" fill="#163449" font-weight="700">OpenLDAP (계정 검증)</text><text x="954" y="276" font-size="18" fill="#263e53" font-weight="400">bind DN으로 자격 확인</text><text x="954" y="304" font-size="18" fill="#263e53" font-weight="400">uid·그룹·sudo 정보 응답</text><polyline points="390,230 490,230" fill="none" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="400" y="212" font-size="17" fill="#2573ad" font-weight="600">SSH 접속</text><polyline points="830,230 930,230" fill="none" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="838" y="212" font-size="17" fill="#2573ad" font-weight="600">LDAP bind</text><polyline points="930,298 830,298" fill="none" stroke="#248361" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#green)"/><text x="838" y="325" font-size="17" fill="#248361" font-weight="600">검증 결과</text><polyline points="490,298 390,298" fill="none" stroke="#248361" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#green)"/><text x="396" y="325" font-size="17" fill="#248361" font-weight="600">허용 / 거부</text><rect x="50" y="380" width="1220" height="58" rx="12" fill="#fff" stroke="#cbd6df"/><text x="72" y="416" font-size="18" fill="#263e53" font-weight="400">화살표는 로그인 한 번의 요청 방향이다. 이 글의 설정은 ldap:// 389라서 bind가 TLS 없이 오간다.</text></g></svg>