"50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">External POM에도 starter-web이 있다. Flux 반환만으로 WebFlux 실행 모델이나 성능 향상을 확정하지 않는다.</text></g></svg>