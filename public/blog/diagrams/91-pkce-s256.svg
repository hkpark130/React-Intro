<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="970" viewBox="0 0 1320 970" role="img" aria-labelledby="title desc"><title id="title">PKCE S256: 해시는 먼저, verifier는 token 요청에서</title><desc id="desc">탈취한 authorization code만으로는 토큰을 교환하지 못하게 한다 (RFC 7636)</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2573ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248361"/></marker></defs><rect width="1320" height="970" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="50" y="62" font-size="32" fill="#142c40" font-weight="700" text-anchor="start">PKCE S256: 해시는 먼저, verifier는 token 요청에서</text><text x="50" y="101" font-size="19" fill="#536b80" font-weight="400" text-anchor="start">탈취한 authorization code만으로는 토큰을 교환하지 못하게 한다 (RFC 7636)</text><rect x="195" y="142" width="280" height="76" rx="14" fill="#eaf2fb" stroke="#b9cbd9" stroke-width="2"/><text x="335" y="177" font-size="21" fill="#163449" font-weight="700" text-anchor="middle">Public client</text><text x="335" y="203" font-size="17" fill="#56707f" font-weight="400" text-anchor="middle">SPA · 확장앱</text><rect x="895" y="142" width="240" height="76" rx="14" fill="#eaf2fb" stroke="#b9cbd9" stroke-width="2"/><text x="1015" y="177" font-size="21" fill="#163449" font-weight="700" text-anchor="middle">인증 서버</text><text x="1015" y="203" font-size="17" fill="#56707f" font-weight="400" text-anchor="middle">Keycloak</text><line x1="335" y1="218" x2="335" y2="842" stroke="#b9cbd9" stroke-width="2" stroke-dasharray="6 7"/><line x1="1015" y1="218" x2="1015" y2="842" stroke="#b9cbd9" stroke-width="2" stroke-dasharray="6 7"/><rect x="65" y="245" width="500" height="108" rx="14" fill="#eaf6ef" stroke="#9dc6b0" stroke-width="2"/><text x="85" y="277" font-size="18" fill="#1d5a45" font-weight="700" text-anchor="start">1. verifier 생성 → S256 challenge 계산</text><text x="85" y="305" font-size="16" fill="#3c5f53" font-weight="400" text-anchor="start">verifier는 보관했다가 4번 POST 본문에 전송</text><text x="85" y="330" font-size="16" fill="#3c5f53" font-weight="400" text-anchor="start">BASE64URL(SHA256(ASCII(verifier)))  (padding 없음)</text><line x1="335" y1="405" x2="1015" y2="405" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="675" y="385" font-size="17" fill="#2573ad" font-weight="700" text-anchor="middle">2. 인증 요청 — code_challenge + code_challenge_method=S256 + state</text><text x="675" y="432" font-size="16" fill="#5f7280" font-weight="400" text-anchor="middle">Keycloak …/realms/{realm}/protocol/openid-connect/auth</text><line x1="1015" y1="505" x2="335" y2="505" stroke="#248361" stroke-width="3" marker-end="url(#green)"/><text x="675" y="485" font-size="17" fill="#248361" font-weight="700" text-anchor="middle">3. callback — authorization code + state</text><text x="675" y="532" font-size="16" fill="#5f7280" font-weight="400" text-anchor="middle">state 확인 후 토큰 교환 · code는 리다이렉트 경로에 나타난다</text><line x1="335" y1="605" x2="1015" y2="605" stroke="#2573ad" stroke-width="3" marker-end="url(#blue)"/><text x="675" y="585" font-size="17" fill="#2573ad" font-weight="700" text-anchor="middle">4. HTTPS POST token — code + code_verifier</text><text x="675" y="632" font-size="16" fill="#5f7280" font-weight="400" text-anchor="middle">Keycloak …/realms/{realm}/protocol/openid-connect/token · 아직 토큰이 아니다</text><rect x="745" y="655" width="530" height="108" rx="14" fill="#eaf6ef" stroke="#9dc6b0" stroke-width="2"/><text x="765" y="687" font-size="18" fill="#1d5a45" font-weight="700" text-anchor="start">5. 해당 code의 challenge와 S256(verifier) 비교</text><text x="765" y="715" font-size="16" fill="#3c5f53" font-weight="400" text-anchor="start">BASE64URL(SHA256(ASCII(verifier)))  (padding 없음)</text><text x="765" y="740" font-size="16" fill="#3c5f53" font-weight="400" text-anchor="start">verifier 소지 확인 — 앱 신원 인증은 아님</text><line x1="1015" y1="830" x2="335" y2="830" stroke="#248361" stroke-width="3" marker-end="url(#green)"/><text x="675" y="810" font-size="17" fill="#248361" font-weight="700" text-anchor="middle">6. token 응답 — OIDC ID token + access token</text><text x="675" y="857" font-size="16" fill="#5f7280" font-weight="400" text-anchor="middle">refresh token은 설정·scope에 따라 선택적으로 포함될 수 있다</text><rect x="50" y="886" width="1220" height="56" rx="12" fill="#fff" stroke="#cbd6df"/><text x="72" y="921" font-size="16" fill="#263e53" font-weight="400" text-anchor="start">state: 시작한 로그인과 callback 연결 · PKCE: verifier 소지 확인 (client_secret 대체 아님)</text></g></svg>