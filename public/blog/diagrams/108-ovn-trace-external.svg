<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1250" viewBox="0 0 1440 1250" role="img" aria-labelledby="title desc">
<title id="title">외부 통신의 논리 스위치·라우터 아키텍처</title><desc id="desc">VM A는 user1_net의 라우터 연결 포트를 선택합니다. user1_router에서 경로 선택, TTL 감소와 SNAT을 수행하고 ext_net의 localnet 포트를 거쳐 물리망에 연결됩니다. 파이프라인 단계는 해당 논리 장치 안에 놓여 있습니다.</desc>
<defs><marker id="packetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087d9a"/></marker><marker id="mutedArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9daeb8"/></marker></defs>
<rect width="1440" height="1250" fill="white"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="30" y="48" font-size="34" fill="#173b49" font-weight="700" >외부 통신 · 스위치에서 라우터를 거쳐 물리망으로</text>
<text x="30" y="91" font-size="23" fill="#546b78" font-weight="400" >논리 장치 3개와 연결 포트를 따라갑니다. ls_*는 스위치 내부, lr_*는 라우터 내부 처리입니다.</text>
