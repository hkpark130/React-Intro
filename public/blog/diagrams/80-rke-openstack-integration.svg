<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">RKE1에서 OpenStack 노드·LB·볼륨 연결하기</title><desc id="desc">Kubernetes 내부의 CCM과 CSI가 별도의 cloud API 경로를 담당한다</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2573ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248361"/></marker></defs><rect width="1320" height="820" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="50" y="62" font-size="34" fill="#142c40" font-weight="700">RKE1에서 OpenStack 노드·LB·볼륨 연결하기</text><text x="50" y="101" font-size="19" fill="#536b80" font-weight="400">Kubernetes 내부의 CCM과 CSI가 별도의 cloud API 경로를 담당한다</text><rect x="50" y="155" width="550" height="535" rx="18" fill="#edf5fa" stroke="#98b9d2" stroke-width="2"/><text x="74" y="190" font-size="25" fill="#163449" font-weight="700">RKE1 클러스터</text><text x="74" y="220" font-size="18" fill="#263e53" font-weight="400">control plane / worker 노드</text><rect x="80" y="270" width="485" height="130" rx="16" fill="#fff" stroke="#b9cbd9" stroke-width="2"/><text x="102" y="306" font-size="23" fill="#163449" font-weight="700">OpenStack CCM</text><text x="102" y="342" font-size="18" fill="#263e53" font-weight="400">Node providerID / 인스턴스 연결</text><text x="102" y="370" font-size="18" fill="#263e53" font-weight="400">LoadBalancer Service 조정</text><rect x="80" y="515" width="485" height="130" rx="16" fill="#fff" stroke="#b9cbd9" stroke-width="2"/><text x="102" y="551" font-size="23" fill="#163449" font-weight="700">Cinder CSI</text><text x="102" y="587" font-size="18" fill="#263e53" font-weight="400">controller: 볼륨과 attach 처리</text><text x="102" y="615" font-size="18" fill="#263e53" font-weight="400">node: mount / unmount</text><rect x="915" y="175" width="350" height="120" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="937" y="211" font-size="23" fill="#163449" font-weight="700">Nova API</text><text x="937" y="247" font-size="18" fill="#263e53" font-weight="400">VM과 Kubernetes Node 매핑</text><rect x="915" y="365" width="350" height="120" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="937" y="401" font-size="23" fill="#163449" font-weight="700">Octavia API</text><text x="937" y="437" font-size="18" fill="#263e53" font-weight="400">LB / listener / pool / member</text><rect x="915" y="555" width="350" height="120" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="937" y="591" font-size="23" fill="#163449" font-weight="700">Cinder / Nova API</text><text x="937" y="627" font-size="18" fill="#263e53" font-weight="400">볼륨 생성 / VM attach·detach</text><polyline points="565,310 700,310 700,237 915,237" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="740" y="216" font-size="17" fill="#2573ad" font-weight="600">노드 정보</text><polyline points="565,363 700,363 700,427 915,427" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="734" y="406" font-size="17" fill="#2573ad" font-weight="600">LoadBalancer 요청</text><polyline points="565,586 720,586 720,615 915,615" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="735" y="567" font-size="17" fill="#2573ad" font-weight="600">PVC 볼륨 요청</text><rect x="50" y="732" width="1220" height="58" rx="12" fill="#fff" stroke="#cbd6df"/><text x="72" y="768" font-size="18" fill="#263e53" font-weight="400">그림은 제어 요청 경로다. 실제 서비스 트래픽·볼륨 I/O 경로와 구분하며, Multi-Attach를 RWX로 해석하지 않는다.</text></g></svg>