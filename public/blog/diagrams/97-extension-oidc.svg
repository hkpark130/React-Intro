<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">확장 앱: 로그인 창의 결과를 background로 받기</title><desc id="desc">원문 설계에 필요한 검증 단계를 표시했다. 현재 프론트 체크아웃에는 인증 모듈이 없다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">확장 앱: 로그인 창의 결과를 background로 받기</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">원문 설계에 필요한 검증 단계를 표시했다. 현재 프론트 체크아웃에는 인증 모듈이 없다.</text><rect x="20" y="140" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="125" y="170" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">확장 UI</text><text x="125" y="196" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">사용자 동작</text><line x1="125" y1="212" x2="125" y2="790" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="280" y="140" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="385" y="170" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">background</text><text x="385" y="196" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">Identity API</text><line x1="385" y1="212" x2="385" y2="790" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="540" y="140" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="645" y="170" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">인증 창</text><text x="645" y="196" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">Chrome web view</text><line x1="645" y1="212" x2="645" y2="790" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="800" y="140" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="905" y="170" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">Keycloak</text><text x="905" y="196" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">인증·token</text><line x1="905" y1="212" x2="905" y2="790" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="1060" y="140" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="1165" y="170" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">API</text><text x="1165" y="196" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">access token 검증</text><line x1="1165" y1="212" x2="1165" y2="790" stroke="#b8c9d7" stroke-dasharray="6 6"/><polyline points="125,255 385,255" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="255" y="242" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">1. 로그인 메시지</text><polyline points="385,320 645,320" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="515" y="307" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">2. launchWebAuthFlow</text><polyline points="645,385 905,385" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="775" y="372" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">3. challenge / state</text><polyline points="905,450 645,450" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="775" y="437" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">4. code / state 반환</text><polyline points="645,515 385,515" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="515" y="502" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">5. callback URL 전달</text><polyline points="385,580 905,580" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="645" y="567" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">6. callback 검증 후 code + verifier</text><polyline points="905,645 385,645" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="645" y="632" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">7. token 응답 · OIDC 검증</text><polyline points="385,710 125,710" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="255" y="697" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">8. UI 인증 상태 갱신</text><polyline points="125,780 1165,780" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="645" y="767" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">9. API 요청: Bearer access token</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">Chrome은 chromiumapp.org callback 도달을 감지한다. 저장소·갱신·state/nonce 구현 완료를 뜻하지 않는다.</text></g></svg>