<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">PowerDNS: 질의와 관리 요청은 다른 경로다</title><desc id="desc">DNS 요청은 Recursor로, zone 변경은 Authoritative HTTP API로 전달하는 역할 분리 예시</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2573ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#248361"/></marker></defs><rect width="1320" height="820" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="50" y="62" font-size="34" fill="#142c40" font-weight="700">PowerDNS: 질의와 관리 요청은 다른 경로다</text><text x="50" y="101" font-size="19" fill="#536b80" font-weight="400">DNS 요청은 Recursor로, zone 변경은 Authoritative HTTP API로 전달하는 역할 분리 예시</text><rect x="55" y="190" width="265" height="125" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><text x="77" y="226" font-size="23" fill="#163449" font-weight="700">DNS 클라이언트</text><text x="77" y="262" font-size="18" fill="#263e53" font-weight="400">신뢰된 질의자</text><text x="77" y="290" font-size="18" fill="#263e53" font-weight="400">내부·외부 이름 조회</text><rect x="455" y="190" width="345" height="125" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><text x="477" y="226" font-size="23" fill="#163449" font-weight="700">Recursor :53</text><text x="477" y="262" font-size="18" fill="#263e53" font-weight="400">cache / recursion</text><text x="477" y="290" font-size="18" fill="#263e53" font-weight="400">내부 zone만 Authoritative로</text><rect x="940" y="190" width="325" height="125" rx="16" fill="#e9f2fb" stroke="#b9cbd9" stroke-width="2"/><text x="962" y="226" font-size="23" fill="#163449" font-weight="700">Authoritative :5300</text><text x="962" y="262" font-size="18" fill="#263e53" font-weight="400">loopback DNS listener</text><text x="962" y="290" font-size="18" fill="#263e53" font-weight="400">관리하는 zone에 응답</text><rect x="455" y="430" width="345" height="125" rx="16" fill="#f0eef9" stroke="#b9cbd9" stroke-width="2"/><text x="477" y="466" font-size="23" fill="#163449" font-weight="700">외부 이름 조회</text><text x="477" y="502" font-size="18" fill="#263e53" font-weight="400">직접 재귀 또는 upstream</text><text x="477" y="530" font-size="18" fill="#263e53" font-weight="400">운영 정책에 따라 선택</text><rect x="55" y="585" width="285" height="115" rx="16" fill="#eaf6ef" stroke="#b9cbd9" stroke-width="2"/><text x="77" y="621" font-size="23" fill="#163449" font-weight="700">관리 UI / 운영 도구</text><text x="77" y="657" font-size="18" fill="#263e53" font-weight="400">인증된 zone 변경 요청</text><rect x="455" y="585" width="345" height="115" rx="16" fill="#eaf6ef" stroke="#b9cbd9" stroke-width="2"/><text x="477" y="621" font-size="23" fill="#163449" font-weight="700">Authoritative HTTP API</text><text x="477" y="657" font-size="18" fill="#263e53" font-weight="400">내장 관리 listener :8081</text><rect x="940" y="430" width="325" height="125" rx="16" fill="#fff3e6" stroke="#b9cbd9" stroke-width="2"/><text x="962" y="466" font-size="23" fill="#163449" font-weight="700">gmysql 저장소</text><text x="962" y="502" font-size="18" fill="#263e53" font-weight="400">zone / record 데이터</text><text x="962" y="530" font-size="18" fill="#263e53" font-weight="400">별도 DB 자격정보</text><polyline points="320,247 455,247" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="348" y="230" font-size="17" fill="#2573ad" font-weight="600">DNS 질의</text><polyline points="800,247 940,247" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="824" y="230" font-size="17" fill="#2573ad" font-weight="600">내부 zone</text><polyline points="630,315 630,430" fill="none" stroke="#2573ad" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#blue)"/><text x="648" y="379" font-size="17" fill="#2573ad" font-weight="600">그 밖의 이름</text><polyline points="1100,315 1100,430" fill="none" stroke="#2573ad" stroke-width="3"  marker-end="url(#blue)"/><text x="1118" y="379" font-size="17" fill="#2573ad" font-weight="600">zone 조회</text><polyline points="340,646 455,646" fill="none" stroke="#248361" stroke-width="3"  marker-end="url(#green)"/><text x="353" y="624" font-size="17" fill="#248361" font-weight="600">관리 요청</text><polyline points="800,646 1100,646 1100,555" fill="none" stroke="#248361" stroke-width="3"  marker-end="url(#green)"/><text x="884" y="622" font-size="17" fill="#248361" font-weight="600">zone 변경</text><rect x="50" y="732" width="1220" height="58" rx="12" fill="#fff" stroke="#cbd6df"/><text x="72" y="768" font-size="18" fill="#263e53" font-weight="400">화살표는 요청 방향을 나타낸다. Recursor ACL과 관리 API 접근 제어는 각각 제한해야 한다.</text></g></svg>