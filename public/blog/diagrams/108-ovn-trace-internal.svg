<text x="970" y="703" font-size="23" fill="#087d9a" font-weight="700" >이 경로의 패킷</text>
<text x="970" y="739" font-size="24" fill="#173b49" font-weight="600" font-family="Consolas,ui-monospace,monospace">10.0.0.217 → 10.0.0.76</text>
<text x="970" y="775" font-size="22" fill="#546b78" font-weight="400" >IP 유지 · TTL 64 유지</text>
<text x="30" y="895" font-size="24" fill="#173b49" font-weight="700" >물리 호스트에서는 OVS가 이 논리 동작을 실행합니다</text>
<rect x="30" y="917" width="669" height="102" rx="14" fill="#f8fafb" stroke="#d5dfe5" stroke-width="2" />
<text x="49" y="949" font-size="22" fill="#546b78" font-weight="700" >같은 호스트에 있을 때</text>
<text x="49" y="987" font-size="22" fill="#173b49" font-weight="400" font-family="Consolas,ui-monospace,monospace">VM A → tap → br-int → tap → VM B</text>
<rect x="719" y="917" width="691" height="102" rx="14" fill="#f8fafb" stroke="#d5dfe5" stroke-width="2" />
<text x="738" y="949" font-size="22" fill="#546b78" font-weight="700" >서로 다른 호스트에 있을 때</text>
<text x="738" y="987" font-size="20" fill="#173b49" font-weight="400" >출발 br-int (ingress) → Geneve → 도착 br-int (egress)</text>
<text x="30" y="1055" font-size="21" fill="#546b78" font-weight="400" >숫자는 본문 trace의 테이블 번호입니다. VM B의 실제 호스트 위치는 이 논리 trace만으로 결정하지 않습니다.</text></g></svg>