<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1080" viewBox="0 0 1440 1080" role="img" aria-labelledby="title desc">
<title id="title">내부 통신의 논리 스위치 아키텍처</title><desc id="desc">VM A와 VM B가 하나의 user1_net 논리 스위치에 연결됩니다. 입력 파이프라인, L2 전달, 출력 파이프라인은 그 스위치 내부 처리이며, 라우터로 연결된 포트는 이번 패킷이 선택하지 않습니다.</desc>
<defs><marker id="packetArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#087d9a"/></marker><marker id="mutedArrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#9daeb8"/></marker></defs>
<rect width="1440" height="1080" fill="white"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="30" y="48" font-size="34" fill="#173b49" font-weight="700" >내부 통신 · 하나의 논리 스위치에 연결된 두 VM</text>
<text x="30" y="91" font-size="23" fill="#546b78" font-weight="400" >큰 파란 테두리 전체가 user1_net 한 개입니다. ls_in_* / ls_out_*는 그 안에서 실행하는 처리 단계입니다.</text>
