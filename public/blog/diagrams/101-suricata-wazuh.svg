<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">Suricata → Wazuh: 패킷 분석 결과를 이벤트로 수집한다</title><desc id="desc">처음은 관측 패킷 입력, 이후는 이벤트 데이터 흐름이다. Wazuh는 패킷 전달 경로 밖에 있다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">Suricata → Wazuh: 패킷 분석 결과를 이벤트로 수집한다</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">처음은 관측 패킷 입력, 이후는 이벤트 데이터 흐름이다. Wazuh는 패킷 전달 경로 밖에 있다.</text><rect x="50" y="170" width="300" height="145" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="206" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">관측 인터페이스</text><text x="70" y="242" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">센서에 도달한 트래픽</text><text x="70" y="271" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">전체망 가시성은 별도 조건</text><rect x="500" y="170" width="300" height="145" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="520" y="206" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Suricata</text><text x="520" y="242" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">IDS 분석 / ruleset</text><text x="520" y="271" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">EVE JSON 기록</text><rect x="970" y="170" width="300" height="145" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="990" y="206" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Wazuh agent</text><text x="990" y="242" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">eve.json 읽기</text><text x="990" y="271" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">manager로 이벤트 전송</text><rect x="970" y="480" width="300" height="145" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="990" y="516" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Wazuh manager</text><text x="990" y="552" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">decoder / rule 처리</text><text x="990" y="581" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">경보 이벤트 생성</text><rect x="500" y="480" width="300" height="145" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="520" y="516" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Indexer / OpenSearch</text><text x="520" y="552" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">경보 저장</text><text x="520" y="581" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">시간 범위·SID 집계</text><rect x="50" y="405" width="300" height="120" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="441" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Dashboard</text><text x="70" y="477" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">저장된 경보 조회</text><rect x="50" y="620" width="300" height="120" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="656" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Monitor → Mattermost</text><text x="70" y="692" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">집계 기반 알림</text><polyline points="350,240 500,240" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="425" y="221" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">패킷 분석</text><polyline points="800,240 970,240" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="885" y="221" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">EVE JSON</text><polyline points="1120,315 1120,480" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="1190" y="409" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">이벤트</text><polyline points="970,555 800,555" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="885" y="536" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">경보 저장</text><polyline points="500,525 425,525 425,465 350,465" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="412" y="445" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">조회 결과</text><polyline points="500,595 425,595 425,680 350,680" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="425" y="720" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">집계 결과</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">원문에 inline IPS 차단 설정·침해 대응 결과는 없다. 상위 30개 SID와 전체 이벤트 수는 다른 지표다.</text></g></svg>