ext x="398" y="363" class="small">상세 journal 미보존</text></g><path d="M648 420 H667" class="arrow" /><g id="column-3"><rect x="672" y="155" width="284" height="520" rx="16" fill="#fff4e6" stroke="#b7792d" stroke-width="1.7" /><text x="694" y="197" class="head">당시 조치</text><rect x="690" y="230" width="248" height="66" rx="10" class="card" /><text x="706" y="258" class="body">unit 재배치</text><rect x="690" y="314" width="248" height="87" rx="10" class="card" /><text x="706" y="342" class="body">relation 재구성</text><text x="706" y="363" class="small">gateway 프로세스 기동</text></g><path d="M956 420 H976" class="arrow" /><g id="column-4"><rect x="980" y="155" width="284" height="520" rx="16" fill="#f2edfb" stroke="#7357b8" stroke-width="1.7" /><text x="1002" y="197" class="head">검증·후속</text><rect x="998" y="230" width="248" height="66" rx="10" class="card" /><text x="1014" y="258" class="body">API 응답 회복</text><rect x="998" y="314" width="248" height="66" rx="10" class="card" /><text x="1014" y="342" class="body">원인 제거 증거는 아님</text><rect x="998" y="398" width="248" height="87" rx="10" class="card" /><text x="1014" y="426" class="body">재발 시 로그 보존</text><text x="1014" y="447" class="small">systemd·hook·quorum</text></g><rect x="55" y="715" width="1210" height="55" rx="11" fill="#fff" stroke="#d2dae3" /><text x="78" y="748" class="body">설정 오류와 포트 충돌 등은 커뮤니티 유사 사례이며 당시 환경의 확정 원인이 아니다.</text></svg>