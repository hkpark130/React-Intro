<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1010" viewBox="0 0 1320 1010" role="img" aria-labelledby="title desc"><title id="title">Cinder Multi-Attach와 Manila NFS 공유는 다르다</title><desc id="desc">위는 같은 block device의 위험한 동시 mount 사례, 아래는 파일 namespace를 공유한 전환 구성이다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2775ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#278464"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b34848"/></marker></defs><rect width="1320" height="1010" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="59" font-size="32" fill="#17384f" font-weight="700">Cinder Multi-Attach와 Manila NFS 공유는 다르다</text><text x="45" y="96" font-size="19" fill="#526c80" font-weight="400">위는 같은 block device의 위험한 동시 mount 사례, 아래는 파일 namespace를 공유한 전환 구성이다.</text><rect x="45" y="137" width="1230" height="315" rx="14" fill="#fff0ee" stroke="#d8afa8" stroke-width="2"/><text x="67" y="176" font-size="23" fill="#913f38" font-weight="700">기존 관찰: 두 host의 ext4 mount는 공유 파일시스템이 아니다</text><rect x="75" y="202" width="285" height="97" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="93" y="235" font-size="22" fill="#173d56" font-weight="700">Worker A / Pod A</text><text x="93" y="264" font-size="18" fill="#294357" font-weight="400">ext4 mount · 독립 cache</text><rect x="75" y="331" width="285" height="97" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="93" y="364" font-size="22" fill="#173d56" font-weight="700">Worker B / Pod B</text><text x="93" y="393" font-size="18" fill="#294357" font-weight="400">ext4 mount · 독립 cache</text><rect x="588" y="251" width="320" height="129" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="606" y="284" font-size="22" fill="#173d56" font-weight="700">같은 Cinder block volume</text><text x="606" y="313" font-size="18" fill="#294357" font-weight="400">동일 filesystem UUID</text><text x="606" y="338" font-size="18" fill="#294357" font-weight="400">Multi-Attach로 양쪽에 연결</text><polyline points="360,250 457,250 457,286 588,286" fill="none" stroke="#b34848" stroke-width="3" marker-end="url(#red)"/><polyline points="360,379 457,379 457,343 588,343" fill="none" stroke="#b34848" stroke-width="3" marker-end="url(#red)"/><text x="378" y="230" font-size="18" fill="#b34848" font-weight="600">block I/O</text><text x="378" y="410" font-size="18" fill="#b34848" font-weight="600">block I/O</text><text x="950" y="276" font-size="20" fill="#913f38" font-weight="700">파일 가시성 불일치 관찰</text><text x="950" y="311" font-size="18" fill="#294357" font-weight="400">분산 lock·cache 조정 없음</text><text x="950" y="345" font-size="18" fill="#294357" font-weight="400">동시 쓰기 시 손상 위험</text><rect x="45" y="485" width="1230" height="414" rx="14" fill="#edf6f0" stroke="#afd0bb" stroke-width="2"/><text x="67" y="525" font-size="23" fill="#22654b" font-weight="700">전환 구성: 두 NFS client가 같은 CephFS share를 사용한다</text><rect x="502" y="550" width="290" height="82" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="520" y="583" font-size="20" fill="#173d56" font-weight="700">Manila CSI</text><text x="520" y="612" font-size="18" fill="#294357" font-weight="400">share / access 관리</text><rect x="976" y="550" width="265" height="82" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="994" y="583" font-size="20" fill="#173d56" font-weight="700">Manila API</text><text x="994" y="612" font-size="18" fill="#294357" font-weight="400">CephFS NFS backend</text><polyline points="792,590 976,590" fill="none" stroke="#278464" stroke-width="3" stroke-dasharray="8 6" marker-end="url(#green)"/><text x="818" y="574" font-size="18" fill="#278464" font-weight="600">제어 요청</text><rect x="75" y="671" width="285" height="90" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="93" y="704" font-size="22" fill="#173d56" font-weight="700">Worker A / Pod A</text><text x="93" y="733" font-size="18" fill="#294357" font-weight="400">NFS mount</text><rect x="75" y="787" width="285" height="90" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="93" y="820" font-size="22" fill="#173d56" font-weight="700">Worker B / Pod B</text><text x="93" y="849" font-size="18" fill="#294357" font-weight="400">NFS mount</text><rect x="540" y="722" width="265" height="122" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="558" y="755" font-size="21" fill="#173d56" font-weight="700">NFS-Ganesha</text><text x="558" y="784" font-size="18" fill="#294357" font-weight="400">NFS protocol endpoint</text><text x="558" y="809" font-size="18" fill="#294357" font-weight="400">CephFS 접근</text><rect x="980" y="710" width="260" height="146" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="998" y="743" font-size="21" fill="#173d56" font-weight="700">CephFS share</text><text x="998" y="772" font-size="18" fill="#294357" font-weight="400">공유 파일 namespace</text><text x="998" y="797" font-size="18" fill="#294357" font-weight="400">MDS: metadata</text><text x="998" y="822" font-size="18" fill="#294357" font-weight="400">RADOS / OSD: data</text><polyline points="360,716 452,716 452,758 540,758" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><polyline points="360,832 452,832 452,807 540,807" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><text x="394" y="697" font-size="18" fill="#278464" font-weight="600">NFS</text><polyline points="805,785 980,785" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><text x="829" y="764" font-size="18" fill="#278464" font-weight="600">파일 접근</text><rect x="45" y="930" width="1230" height="55" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="64" y="965" font-size="18" fill="#294357" font-weight="400">검증 범위는 서로 다른 node의 파일 이름 가시성이다. 동시 쓰기·장애 전환·내구성 검증 완료를 뜻하지 않는다.</text></g></svg>