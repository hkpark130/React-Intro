<?xml version="1.0" encoding="UTF-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#647487"/></marker><style>text{font-family:Malgun Gothic,Apple SD Gothic Neo,sans-serif;fill:#172331}.t{font-size:32px;font-weight:700}.s{font-size:17px;fill:#556577}.h{font-size:20px;font-weight:700}.b{font-size:15px}.n{font-size:13px;fill:#57687a}.c{fill:#fff;stroke:#ccd6df;stroke-width:1.4}.a{fill:none;stroke:#647487;stroke-width:2.4;marker-end:url(#a)}</style></defs><rect width="1320" height="820" fill="#f7f9fc"/><rect width="1320" height="8" fill="#2875a8"/><title id="title">프레임 반사 조사와 LAG 정정 과정</title><desc id="desc">관측 → 메커니즘 확인 → 구성 정정 → 검증 범위의 작업 순서</desc><text x="55" y="60" class="t">프레임 반사 조사와 LAG 정정 과정</text><text x="55" y="92" class="s">관측 → 메커니즘 확인 → 구성 정정 → 검증 범위의 작업 순서</text><g><rect x="55" y="155" width="284" height="520" rx="16" fill="#e8f2fb" stroke="#3979ad" stroke-width="1.7"/><text x="77" y="197" class="h">관측</text><rect x="73" y="230" width="248" height="87" rx="10" class="c"/><text x="89" y="258" class="b">tap·br-ex·bond 동시 캡처</text><text x="89" y="279" class="n">같은 5-tuple과 시각 대조</text><rect x="73" y="335" width="248" height="87" rx="10" class="c"/><text x="89" y="363" class="b">OVS flow cache</text><text x="89" y="384" class="n">drop과 정상 경로가 교대</text></g><path d="M340 420H358" class="a"/><g><rect x="364" y="155" width="284" height="520" rx="16" fill="#eef7f0" stroke="#4d8b61" stroke-width="1.7"/><text x="386" y="197" class="h">반사 메커니즘</text><rect x="382" y="230" width="248" height="87" rx="10" class="c"/><text x="398" y="258" class="b">스위치 flood</text><text x="398" y="279" class="n">FDB 미학습 조건</text><rect x="382" y="335" width="248" height="87" rx="10" class="c"/><text x="398" y="363" class="b">다른 bond 멤버로 재유입</text><text x="398" y="384" class="n">sequence 19개 일치</text></g><path d="M648 420H667" class="a"/><g><rect x="672" y="155" width="284" height="520" rx="16" fill="#fff4e6" stroke="#b7792d" stroke-width="1.7"/><text x="694" y="197" class="h">구성 변경</text><rect x="690" y="230" width="248" height="87" rx="10" class="c"/><text x="706" y="258" class="b">서버 balance-xor</text><text x="706" y="279" class="n">기존 설정</text><rect x="690" y="335" width="248" height="87" rx="10" class="c"/><text x="706" y="363" class="b">스위치 Static LAG</text><text x="706" y="384" class="n">두 멤버를 한 논리 링크로</text></g><path d="M956 420H976" class="a"/><g><rect x="980" y="155" width="284" height="520" rx="16" fill="#f2edfb" stroke="#7357b8" stroke-width="1.7"/><text x="1002" y="197" class="h">검증 범위</text><rect x="998" y="230" width="248" height="87" rx="10" class="c"/><text x="1014" y="258" class="b">1시간 packet 관찰</text><text x="1014" y="279" class="n">손실 재관찰 없음</text><rect x="998" y="335" width="248" height="87" rx="10" class="c"/><text x="1014" y="363" class="b">장기 무재발</text><text x="1014" y="384" class="n">정량 기록 미확인</text></g><rect x="55" y="715" width="1210" height="55" rx="11" fill="#fff" stroke="#d2dae3"/><text x="78" y="748" class="b">LAG는 여러 flow의 집계 대역폭과 링크 장애 대응이며 단일 flow 대역폭 두 배를 보장하지 않는다.</text></svg>