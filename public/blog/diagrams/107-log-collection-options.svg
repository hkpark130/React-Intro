<?xml version="1.0" encoding="utf-8"?><svg xmlns="http://www.w3.org/2000/svg" width="1320" height="820" viewBox="0 0 1320 820" role="img" aria-labelledby="title desc"><title id="title">NFS 로그 수집 경로 비교</title><desc id="desc">stale file handle 관측과 node-local 수집 제안을 분리</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#647487" /></marker><style>text{font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;fill:#172331} .title{font-size:32px;font-weight:700} .sub{font-size:17px;fill:#556577} .head{font-size:20px;font-weight:700} .body{font-size:15px} .small{font-size:13px;fill:#57687a} .card{fill:#fff;stroke:#ccd6df;stroke-width:1.4} .arrow{fill:none;stroke:#647487;stroke-width:2.4;marker-end:url(#arrow)} </style></defs><rect width="1320" height="820" fill="#f7f9fc" /><rect width="1320" height="8" fill="#2875a8" /><text x="55" y="60" class="title">NFS 로그 수집 경로 비교</text><text x="55" y="92" class="sub">stale file handle 관측과 node-local 수집 제안을 분리</text><g id="column-1"><rect x="55" y="155" width="284" height="520" rx="16" fill="#e8f2fb" stroke="#3979ad" stroke-width="1.7" /><text x="77" y="197" class="head">현재 경로</text><rect x="73" y="230" width="248" height="66" rx="10" class="card" /><text x="89" y="258" class="body">Pod → NFS 파일</text><rect x="73" y="314" width="248" height="87" rx="10" class="card" /><text x="89" y="342" class="body">Filebeat가 원격 파일 추적</text><text x="89" y="363" class="small">file identity·재마운트 영향</text></g><g id="column-2"><rect x="364" y="155" width="284" height="520" rx="16" fill="#eef7f0" stroke="#4d8b61" stroke-width="1.7" /><text x="386" y="197" class="head">관측된 실패</text><rect x="382" y="230" width="248" height="66" rx="10" class="card" /><text x="398" y="258" class="body">stale file handle</text><rect x="382" y="314" width="248" height="87" rx="10" class="card" /><text x="398" y="342" class="body">파일 추적 중단 가능</text><text x="398" y="363" class="small">상세 발생 조건은 미확정</text><rect x="382" y="419" width="248" height="87" rx="10" class="card" /><text x="398" y="447" class="body">중앙 로그 공백</text><text x="398" y="468" class="small">당시 증상으로 확인</text></g><g id="column-3"><rect x="672" y="155" width="284" height="520" rx="16" fill="#fff4e6" stroke="#b7792d" stroke-width="1.7" /><text x="694" y="197" class="head">제안 경로</text><rect x="690" y="230" width="248" height="66" rx="10" class="card" /><text x="706" y="258" class="body">Pod stdout/stderr</text><rect x="690" y="314" width="248" height="87" rx="10" class="card" /><text x="706" y="342" class="body">kubelet 노드 로그</text><text x="706" y="363" class="small">표준 Kubernetes 경로</text><rect x="690" y="419" width="248" height="87" rx="10" class="card" /><text x="706" y="447" class="body">또는 node-local 파일</text><text x="706" y="468" class="small">DaemonSet + hostPath</text></g><g id="column-4"><rect x="980" y="155" width="284" height="520" rx="16" fill="#f2edfb" stroke="#7357b8" stroke-width="1.7" /><text x="1002" y="197" class="head">확인할 조건</text><rect x="998" y="230" width="248" height="66" rx="10" class="card" /><text x="1014" y="258" class="body">권한·회전·재시작</text><rect x="998" y="314" width="248" height="87" rx="10" class="card" /><text x="1014" y="342" class="body">버퍼 DB 위치와 내구성</text><text x="1014" y="363" class="small">노드 장애 시 손실 범위</text><rect x="998" y="419" width="248" height="87" rx="10" class="card" /><text x="1014" y="447" class="body">운영 적용 상태</text><text x="1014" y="468" class="small">현재는 제안 단계</text></g><rect x="55" y="715" width="1210" height="55" rx="11" fill="#fff" stroke="#d2dae3" /><text x="78" y="748" class="body">DaemonSet 경로는 설계 제안이며 운영 적용·부하·장애 전환 검증이 남아 있다.</text></svg>