<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="900" viewBox="0 0 1320 900" role="img" aria-labelledby="title desc"><title id="title">계정 원본 하나, 인증 경로는 세 개</title><desc id="desc">웹 SSO · Wi-Fi · SSH는 LDAP을 공유하지만 같은 세션·MFA를 자동 공유하지 않는다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="900" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">계정 원본 하나, 인증 경로는 세 개</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">웹 SSO · Wi-Fi · SSH는 LDAP을 공유하지만 같은 세션·MFA를 자동 공유하지 않는다.</text><rect x="50" y="160" width="280" height="130" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="196" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">웹 앱 + 브라우저</text><text x="70" y="232" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">OIDC / SAML 연동</text><text x="70" y="261" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">앱 세션은 별도로 유지</text><rect x="500" y="160" width="290" height="130" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="520" y="196" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Keycloak</text><text x="520" y="232" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">웹 로그인 / federation</text><text x="520" y="261" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">MFA는 flow별 확인</text><rect x="50" y="395" width="280" height="130" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="431" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Wi-Fi 단말 + AP</text><text x="70" y="467" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">EAP / RADIUS 요청</text><rect x="500" y="395" width="290" height="130" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="520" y="431" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">FreeRADIUS</text><text x="520" y="467" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">EAP 인증 처리</text><text x="520" y="496" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">LDAP 검증 연결</text><rect x="50" y="630" width="280" height="130" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="70" y="666" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">Linux SSH</text><text x="70" y="702" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">PAM 인증 / NSS 조회</text><rect x="500" y="630" width="290" height="130" rx="14" fill="#eaf2fb" stroke="#b9cbd8" stroke-width="2"/><text x="520" y="666" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">SSSD</text><text x="520" y="702" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">사용자·그룹 / 인증</text><text x="520" y="731" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">로컬 cache 정책</text><rect x="1000" y="325" width="270" height="255" rx="14" fill="#eaf6ef" stroke="#b9cbd8" stroke-width="2"/><text x="1020" y="361" font-size="23" fill="#173c56" text-anchor="start" font-weight="700">OpenLDAP</text><text x="1020" y="397" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">사용자 / 그룹 원본</text><text x="1020" y="426" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">각 서비스가 직접 참조</text><text x="1020" y="455" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">schema · ACL · TLS</text><polyline points="330,225 500,225" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="415" y="205" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">웹 로그인</text><polyline points="330,460 500,460" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="415" y="440" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">Wi-Fi 인증</text><polyline points="330,695 500,695" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="415" y="675" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">조회 / 인증</text><polyline points="790,225 1135,225 1135,325" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="1020" y="203" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">federation / 인증</text><polyline points="790,460 1000,460" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="895" y="439" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">검색 / bind</text><polyline points="790,695 1135,695 1135,580" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="1005" y="729" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">POSIX 조회 / 인증</text><rect x="45" y="820" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="852" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">계정 제거 뒤 기존 token·앱 세션·Wi-Fi 연결·SSSD offline cache의 무효화는 경로마다 검증해야 한다.</text></g></svg>