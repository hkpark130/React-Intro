<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1400" viewBox="0 0 1320 1400" role="img" aria-labelledby="title desc"><title id="title">API 요청 redirect와 로그인 페이지 이동을 구분한다</title><desc id="desc">두 흐름은 독립 비교다. 아래는 서버 세션 기반 로그인 설계 예시이며 당시 검증 완료 기록은 없다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2677ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#28785e"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b84b50"/></marker></defs><rect width="1320" height="1400" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="57" font-size="32" fill="#123349" text-anchor="start" font-weight="700">API 요청 redirect와 로그인 페이지 이동을 구분한다</text><text x="45" y="96" font-size="19" fill="#587084" text-anchor="start" font-weight="400">두 흐름은 독립 비교다. 아래는 서버 세션 기반 로그인 설계 예시이며 당시 검증 완료 기록은 없다.</text><rect x="45" y="135" width="1230" height="340" rx="14" fill="#fff0ef" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="170" font-size="22" fill="#964049" text-anchor="start" font-weight="700">A. API fetch가 로그인 redirect를 따라가는 경우</text><rect x="75" y="190" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="180" y="220" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">SPA fetch</text><text x="180" y="246" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">주소창 이동 아님</text><line x1="180" y1="262" x2="180" y2="460" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="545" y="190" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="650" y="220" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">API / Spring</text><text x="650" y="246" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">미인증 요청</text><line x1="650" y1="262" x2="650" y2="460" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="1025" y="190" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="1130" y="220" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">Keycloak</text><text x="1130" y="246" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">로그인 endpoint</text><line x1="1130" y1="262" x2="1130" y2="460" stroke="#b8c9d7" stroke-dasharray="6 6"/><polyline points="180,310 650,310" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="415" y="297" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">1. API 요청</text><polyline points="650,375 180,375" fill="none" stroke="#b84b50" stroke-width="3"  marker-end="url(#red)"/><text x="415" y="362" font-size="18" fill="#b84b50" text-anchor="middle" font-weight="600">2. 302: Location = IdP 로그인 주소</text><polyline points="180,440 1130,440" fill="none" stroke="#b84b50" stroke-width="3"  marker-end="url(#red)"/><text x="655" y="427" font-size="18" fill="#b84b50" text-anchor="middle" font-weight="600">3. fetch가 IdP로 요청 · 응답 읽기는 CORS 적용</text><rect x="45" y="505" width="1230" height="790" rx="14" fill="#edf6f1" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="542" font-size="22" fill="#235e47" text-anchor="start" font-weight="700">B. API의 401을 확인한 뒤, 별도의 로그인 navigation 시작</text><rect x="75" y="565" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="180" y="595" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">브라우저</text><text x="180" y="621" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">SPA / 페이지 이동</text><line x1="180" y1="637" x2="180" y2="1270" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="545" y="565" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="650" y="595" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">Spring</text><text x="650" y="621" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">세션 / callback</text><line x1="650" y1="637" x2="650" y2="1270" stroke="#b8c9d7" stroke-dasharray="6 6"/><rect x="1025" y="565" width="210" height="72" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="1130" y="595" font-size="22" fill="#173c56" text-anchor="middle" font-weight="700">Keycloak</text><text x="1130" y="621" font-size="16" fill="#587084" text-anchor="middle" font-weight="400">IdP 세션</text><line x1="1130" y1="637" x2="1130" y2="1270" stroke="#b8c9d7" stroke-dasharray="6 6"/><polyline points="180,685 650,685" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="415" y="672" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">1. 로그인 시작 URL로 navigation</text><polyline points="650,755 180,755" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="415" y="742" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">2. 302: Location = authorize URL</text><polyline points="180,825 1130,825" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="655" y="812" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">3. 브라우저가 authorize로 이동 · 사용자 로그인</text><polyline points="1130,895 180,895" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="655" y="882" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">4. 302: Location = 앱 callback + code</text><polyline points="180,965 650,965" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="415" y="952" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">5. 브라우저가 callback 요청</text><polyline points="650,1035 1130,1035" fill="none" stroke="#2677ad" stroke-width="3"  marker-end="url(#blue)"/><text x="890" y="1022" font-size="18" fill="#2677ad" text-anchor="middle" font-weight="600">6. 서버가 code를 token으로 교환</text><polyline points="1130,1105 650,1105" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="890" y="1092" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">7. token 응답 · 서버에서 검증</text><polyline points="650,1175 180,1175" fill="none" stroke="#28785e" stroke-width="3"  marker-end="url(#green)"/><text x="415" y="1162" font-size="18" fill="#28785e" text-anchor="middle" font-weight="600">8. 앱 세션 쿠키 · 앱 복귀 redirect</text><text x="70" y="1250" font-size="19" fill="#243b53" text-anchor="start" font-weight="400">API 세션과 Keycloak 세션은 별개다. 이후 API 요청은 서버에서 인증 상태를 확인한다.</text><rect x="45" y="1320" width="1230" height="50" rx="14" fill="#fff" stroke="#b9cbd8" stroke-width="2"/><text x="65" y="1352" font-size="18" fill="#243b53" text-anchor="start" font-weight="400">모든 화살표는 실제 요청·응답의 전달 방향이다. 302를 받는 브라우저와 code 교환 서버를 구분한다.</text></g></svg>