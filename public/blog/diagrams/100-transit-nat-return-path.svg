<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="1120" viewBox="0 0 1320 1120" role="img" aria-labelledby="title desc"><title id="title">Transit 전환 뒤 SSH가 돌아오는 NAT 경로</title><desc id="desc">원문에 기록한 주소다. 위에서 아래로 시간을 읽고, 파랑은 SYN 요청·초록은 SYN/ACK 응답이다.</desc><defs><marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#2775ad"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#278464"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#b34848"/></marker></defs><rect width="1320" height="1120" fill="#f7f9fc"/><g font-family="Malgun Gothic,Segoe UI,sans-serif"><text x="45" y="59" font-size="32" fill="#17384f" font-weight="700">Transit 전환 뒤 SSH가 돌아오는 NAT 경로</text><text x="45" y="96" font-size="19" fill="#526c80" font-weight="400">원문에 기록한 주소다. 위에서 아래로 시간을 읽고, 파랑은 SYN 요청·초록은 SYN/ACK 응답이다.</text><line x1="155" y1="230" x2="155" y2="978" stroke="#b8c7d3" stroke-width="2" stroke-dasharray="6 6"/><line x1="460" y1="230" x2="460" y2="978" stroke="#b8c7d3" stroke-width="2" stroke-dasharray="6 6"/><line x1="805" y1="230" x2="805" y2="978" stroke="#b8c7d3" stroke-width="2" stroke-dasharray="6 6"/><line x1="1160" y1="230" x2="1160" y2="978" stroke="#b8c7d3" stroke-width="2" stroke-dasharray="6 6"/><rect x="55" y="135" width="200" height="91" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="73" y="168" font-size="22" fill="#173d56" font-weight="700">Client C</text><text x="73" y="197" font-size="18" fill="#294357" font-weight="400">192.168.2.x</text><rect x="345" y="135" width="230" height="91" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="363" y="168" font-size="22" fill="#173d56" font-weight="700">Router B</text><text x="363" y="197" font-size="18" fill="#294357" font-weight="400">Transit 172.16.255.2</text><rect x="657" y="135" width="296" height="91" rx="14" fill="#fff1e4" stroke="#bfd0df" stroke-width="2"/><text x="675" y="168" font-size="22" fill="#173d56" font-weight="700">Router A · NAT</text><text x="675" y="197" font-size="18" fill="#294357" font-weight="400">Public P: 220.75.198.106</text><rect x="1050" y="135" width="220" height="91" rx="14" fill="#edf5fb" stroke="#bfd0df" stroke-width="2"/><text x="1068" y="168" font-size="22" fill="#173d56" font-weight="700">Server S</text><text x="1068" y="197" font-size="18" fill="#294357" font-weight="400">192.168.2.11</text><polyline points="155,281 460,281" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="173" y="269" font-size="18" fill="#2775ad" font-weight="600">1. C → P:22</text><polyline points="460,332 805,332" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="478" y="320" font-size="18" fill="#2775ad" font-weight="600">2. C → P:22</text><rect x="656" y="352" width="318" height="132" rx="14" fill="#fff1e4" stroke="#bfd0df" stroke-width="2"/><text x="674" y="385" font-size="21" fill="#173d56" font-weight="700">Router A의 변환</text><text x="674" y="414" font-size="18" fill="#294357" font-weight="400">DNAT: P → S</text><text x="674" y="439" font-size="18" fill="#294357" font-weight="400">SNAT: C → A(172.16.255.1)</text><text x="674" y="464" font-size="18" fill="#294357" font-weight="400">다음 hop: Router B</text><polyline points="805,518 460,518" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="478" y="506" font-size="18" fill="#2775ad" font-weight="600">3. A transit → S:22</text><polyline points="460,574 1160,574" fill="none" stroke="#2775ad" stroke-width="3" marker-end="url(#blue)"/><text x="478" y="562" font-size="18" fill="#2775ad" font-weight="600">4. B가 server로 전달: A transit → S:22</text><polyline points="1160,645 460,645" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><text x="478" y="633" font-size="18" fill="#278464" font-weight="600">5. 응답: S:22 → A transit</text><polyline points="460,701 805,701" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><text x="478" y="689" font-size="18" fill="#278464" font-weight="600">6. B가 Router A로 반환</text><rect x="656" y="724" width="318" height="108" rx="14" fill="#e7f3ed" stroke="#bfd0df" stroke-width="2"/><text x="674" y="757" font-size="21" fill="#173d56" font-weight="700">Router A의 역변환</text><text x="674" y="786" font-size="18" fill="#294357" font-weight="400">source: S → P</text><text x="674" y="811" font-size="18" fill="#294357" font-weight="400">destination: A transit → C</text><polyline points="805,864 460,864" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><text x="478" y="852" font-size="18" fill="#278464" font-weight="600">7. P:22 → C</text><polyline points="460,923 155,923" fill="none" stroke="#278464" stroke-width="3" marker-end="url(#green)"/><text x="173" y="911" font-size="18" fill="#278464" font-weight="600">8. P:22 → C</text><text x="58" y="1001" font-size="18" fill="#294357" font-weight="400">Client와 Server는 Router B의 같은 내부망에 있다. SNAT로 응답 목적지를 A transit으로 바꿔 NAT 장비 우회를 막는다.</text><rect x="45" y="1040" width="1230" height="55" rx="14" fill="#fff" stroke="#bfd0df" stroke-width="2"/><text x="64" y="1075" font-size="18" fill="#294357" font-weight="400">DNAT 유입 인터페이스·정적 route·방화벽 평가 지점은 장비별로 확인한다. SNAT 필요 여부도 반환 route에 달려 있다.</text></g></svg>