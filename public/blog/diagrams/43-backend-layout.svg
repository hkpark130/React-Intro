<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="680" viewBox="0 0 1100 680" role="img" aria-labelledby="title desc">
<title id="title">AWS 백엔드 구성과 요청 경로</title>
<desc id="desc">ALB에서 ECS Fargate로 전달하는 HTTP 요청과 NAT Gateway를 통한 외부 통신 경로. ECS 서비스와 Aurora DB 서브넷 그룹에 지정한 두 Private 서브넷을 함께 표시했다.</desc>
<defs><marker id="request" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#256b9d"/></marker><marker id="outbound" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M0 0L9 4.5L0 9" fill="#a87520"/></marker></defs>
<rect width="1100" height="680" rx="16" fill="#f5f8fc"/>
<g font-family="Malgun Gothic,Segoe UI,Arial,sans-serif" fill="#17334c"><text x="30" y="39" font-size="23" font-weight="700">AWS 백엔드 구성과 요청 경로</text><text x="30" y="66" font-size="15">2022년 3월 · 가용 영역 2개, NAT Gateway 1개</text>
<rect x="260" y="83" width="360" height="43" rx="8" fill="#fff" stroke="#8da9c1"/><text x="440" y="110" text-anchor="middle" font-size="17">Internet client</text>
<rect x="28" y="151" width="1044" height="434" rx="12" fill="#fff" stroke="#8da9c1" stroke-width="2"/>
<text x="47" y="178" font-size="16" font-weight="700">VPC</text>
<rect x="48" y="198" width="500" height="362" rx="10" fill="#f1f6fb"/><rect x="564" y="198" width="488" height="362" rx="10" fill="#f1f6fb"/>
<text x="68" y="225" font-size="17" font-weight="700">AZ A</text><text x="586" y="225" font-size="17" font-weight="700">AZ B</text>
<g fill="#e7f1fa" stroke="#acc3d7"><rect x="63" y="241" width="470" height="123" rx="8"/><rect x="580" y="241" width="456" height="123" rx="8"/></g>
<text x="263" y="266" font-size="14">Public subnet A</text><text x="596" y="266" font-size="14">Public subnet B</text>
<rect x="263" y="281" width="554" height="61" rx="8" fill="#fff" stroke="#4383b1" stroke-width="2"/>
<text x="540" y="306" text-anchor="middle" font-size="18">Application Load Balancer</text><text x="540" y="329" text-anchor="middle" font-size="14">Internet-facing · HTTP 80 · IP targets</text>
<rect x="80" y="288" width="157" height="55" rx="8" fill="#fff8e9" stroke="#bc964e"/>
<text x="158" y="311" text-anchor="middle" font-size="16">NAT Gateway</text><text x="158" y="332" text-anchor="middle" font-size="13">Single gateway in A</text>
<g fill="#eaf4ec" stroke="#a6c9ad"><rect x="63" y="383" width="470" height="156" rx="8"/><rect x="580" y="383" width="456" height="156" rx="8"/></g>
<text x="263" y="406" font-size="14">Private subnet A</text><text x="596" y="406" font-size="14">Private subnet B</text>
<rect x="263" y="419" width="554" height="47" rx="8" fill="#fff" stroke="#669874" stroke-width="1.5"/><rect x="263" y="493" width="554" height="47" rx="8" fill="#fff" stroke="#669874" stroke-width="1.5"/>
<text x="540" y="439" text-anchor="middle" font-size="17">ECS Fargate 서비스 · nginx 컨테이너</text><text x="540" y="458" text-anchor="middle" font-size="13">서비스에 지정한 서브넷: A + B</text>
<text x="540" y="513" text-anchor="middle" font-size="17">Aurora DB 서브넷 그룹</text><text x="540" y="532" text-anchor="middle" font-size="13">그룹에 지정한 서브넷: A + B</text>
<g stroke="#256b9d" stroke-width="2.5" fill="none" marker-end="url(#request)"><path d="M440 126V277"/><path d="M440 342V415"/></g>
<text x="458" y="385" font-size="13" fill="#256b9d">HTTP 요청</text>
<g stroke="#a87520" stroke-width="2.5" fill="none" marker-end="url(#outbound)"><path d="M263 443H158V347"/><path d="M158 288V142H856"/></g>
<text x="72" y="436" font-size="13" fill="#8a5c12">Private</text><text x="72" y="455" font-size="13" fill="#8a5c12">outbound</text>
<rect x="860" y="85" width="206" height="83" rx="8" fill="#fff8e9" stroke="#bc964e"/><text x="963" y="110" text-anchor="middle" font-size="15">ECR / Logs / Internet</text><text x="963" y="135" text-anchor="middle" font-size="13">NAT → IGW 경로</text><text x="963" y="155" text-anchor="middle" font-size="13">이미지 가져오기·로그 전송</text>
<text x="30" y="619" font-size="15">파랑: ALB에서 컨테이너로 전달하는 요청. 주황: NAT Gateway를 거치는 외부 통신.</text><text x="30" y="646" font-size="15">Public 서브넷은 IGW로, Private 서브넷은 NAT Gateway로 기본 경로를 설정.</text>
</g></svg>
