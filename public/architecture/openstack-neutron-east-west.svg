<text x="56" y="111" font-size="22" font-weight="400" fill="#52677d" text-anchor="start"><tspan x="56" dy="0">동일한 논리 스위치의 내부 통신 · 2026년 3월 경로 분석</tspan></text>
<rect x="36" y="146" width="1368" height="255" rx="12" fill="#f6f9fc" stroke="#d3dfe9" stroke-width="1.7"/>
