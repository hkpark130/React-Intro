<text x="62" y="481" font-size="26" font-weight="700" fill="#243b53" text-anchor="start"><tspan x="62" dy="0">다른 호스트 · 같은 서브넷</tspan></text>
<text x="62" y="517" font-size="21" font-weight="400" fill="#087b75" text-anchor="start"><tspan x="62" dy="0">논리 네트워크는 유지하고, 호스트 사이를 Geneve로 연결</tspan></text>
<rect x="66" y="548" width="510" height="152" rx="12" fill="#ffffff" stroke="#b9cfe4" stroke-width="1.7"/>
