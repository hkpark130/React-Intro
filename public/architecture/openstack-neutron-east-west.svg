<g><rect x="360" y="603" width="192" height="72" rx="9" fill="#eaf7f5" stroke="#afd8d2" stroke-width="1.7"/><text x="456" y="637" font-size="24" font-weight="600" fill="#243b53" text-anchor="middle" data-max-width="174"><tspan x="456" dy="0">br-int</tspan></text><text x="456" y="668" font-size="18" font-weight="400" fill="#52677d" text-anchor="middle" data-max-width="176"><tspan x="456" dy="0">OVS</tspan></text></g>
