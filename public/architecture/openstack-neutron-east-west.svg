<text x="62" y="226" font-size="21" font-weight="400" fill="#087b75" text-anchor="start"><tspan x="62" dy="0">하나의 br-int 안에서 전달</tspan></text>
<rect x="66" y="250" width="1308" height="123" rx="12" fill="#ffffff" stroke="#b9cfe4" stroke-width="1.7"/>
