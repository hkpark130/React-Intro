<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="910" viewBox="0 0 1440 910" role="img" aria-labelledby="openstack-neutron-east-west-title openstack-neutron-east-west-description">
<title id="openstack-neutron-east-west-title">동일 서브넷 VM 간의 local br-int와 Geneve 통신</title>
<desc id="openstack-neutron-east-west-description">같은 호스트는 VM A, tap, br-int, tap, VM B 순서로 전달한다. 다른 호스트는 양쪽 br-int 사이의 Geneve 터널로 연결한다. 서로 다른 서브넷은 분산 논리 라우팅을 사용한다. VM과 호스트는 익명 역할이며 실제 배치 개수를 나타내지 않는다.</desc>
<metadata>{&quot;evidence&quot;:&quot;Network inventory: 2026-09-11. OVS path: March and July 2026 records. Representative roles, not a physical equipment inventory.&quot;,&quot;officialReferences&quot;:[&quot;https://docs.openstack.org/neutron/2023.2/admin/ovn/routing.html&quot;,&quot;https://www.ovn.org/support/dist-docs/ovn-architecture.7.html&quot;],&quot;credits&quot;:[]}</metadata>
<defs><marker id="control-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#705394" stroke-width="1.6" stroke-linejoin="round"/></marker><marker id="packet-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 1 1 L 9 5 L 1 9" fill="none" stroke="#087b75" stroke-width="1.6" stroke-linejoin="round"/></marker></defs>
