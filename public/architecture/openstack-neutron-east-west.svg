<g><rect x="542" y="271" width="270" height="78" rx="9" fill="#eaf7f5" stroke="#afd8d2" stroke-width="1.7"/><text x="677" y="305" font-size="25" font-weight="600" fill="#243b53" text-anchor="middle" data-max-width="252"><tspan x="677" dy="0">br-int</tspan></text><text x="677" y="336" font-size="18" font-weight="400" fill="#52677d" text-anchor="middle" data-max-width="254"><tspan x="677" dy="0">동일 논리 스위치의 L2 전달</tspan></text></g>
