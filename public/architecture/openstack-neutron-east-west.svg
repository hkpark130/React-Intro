<text x="720" y="600" font-size="24" font-weight="600" fill="#087b75" text-anchor="middle"><tspan x="720" dy="0">Geneve 터널</tspan></text>
<text x="720" y="681" font-size="18" font-weight="400" fill="#52677d" text-anchor="middle"><tspan x="720" dy="0">물리 IP 연결 위의 캡슐화</tspan></text>
<path d="M 1080 641 L 1186 641" fill="none" stroke="#087b75" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#packet-arrow)"></path>
<text x="1135" y="625" font-size="20" font-weight="400" fill="#087b75" text-anchor="middle"><tspan x="1135" dy="0">tap</tspan></text>
<text x="62" y="732" font-size="21" font-weight="400" fill="#52677d" text-anchor="start"><tspan x="62" dy="0">동일 서브넷 통신에는 Logical Router의 라우팅이 필요하지 않습니다.</tspan></text>
<text x="56" y="802" font-size="22" font-weight="600" fill="#243b53" text-anchor="start" data-max-width="1300"><tspan x="56" dy="0">다른 서브넷의 내부 통신은 Logical Router의 분산 라우팅을 거칩니다.</tspan></text>
<text x="56" y="838" font-size="20" font-weight="400" fill="#52677d" text-anchor="start" data-max-width="1300"><tspan x="56" dy="0">공식 OVN 동작: Compute 사이에서 처리하며, 외부 통신용 gateway를 일괄 경유하지 않습니다.</tspan></text>
<text x="56" y="879" font-size="20" font-weight="400" fill="#52677d" text-anchor="start" data-max-width="1300"><tspan x="56" dy="0">VM A/B와 호스트 박스는 경로 설명을 위한 역할이며 실제 인스턴스 이름·배치·수량을 뜻하지 않습니다.</tspan></text>
